name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  VERSION: 0.1.0
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare SDK and Wrapper
        run: |
          chmod +x gradlew
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, Lint, Debug APK and device test APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Name APK and verify signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LuLeMa-v${VERSION}-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/LuLeMa-v${VERSION}-debug.apk"
          cd dist && sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: LuLeMa-v${{ env.VERSION }}-debug
          path: dist/
          if-no-files-found: error
      - name: Retain checks and APKs even when a check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure accelerated emulator
        run: |
          set -Eeuo pipefail
          trap 'echo "Failed command: $BASH_COMMAND" >> "$GITHUB_STEP_SUMMARY"; tail -60 emulator.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true' ERR
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-30;default;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ci --package 'system-images;android-30;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell svc wifi disable
          adb shell svc data disable
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
      - name: Collect device diagnostics
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" logcat -d > device-logcat.txt || true
          "$ANDROID_HOME/platform-tools/adb" root || true
          timeout 30 "$ANDROID_HOME/platform-tools/adb" wait-for-device || true
          "$ANDROID_HOME/platform-tools/adb" pull /data/media/0/Android/data/com.lulema.app/files/screenshots screenshots || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            device-logcat.txt
            screenshots/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, device-tests]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check signing requirements
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release skipped: one or more signing secrets are missing. Debug APK remains in build artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v6
        if: steps.keys.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.keys.outputs.ready == 'true'
      - name: Build signed release and checksums
        id: sign
        if: steps.keys.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          chmod +x gradlew
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LuLeMa-v${VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/LuLeMa-v${VERSION}.apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/LuLeMa-v${VERSION}.apk")
          echo "$badging" | head -1 | grep -F "versionName='$VERSION'"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf '# 撸了吗 %s\n\n发布日期：%s（UTC）\n\n人类迷惑行为研究所正式营业。\n\n- 离线档案、月历和统计\n- 成就、低频中性提醒和深色模式\n- 明文或 AES-GCM 密码备份、事务导入\n\n首次安装前请核对 SHA256SUMS。升级前请备份。通知可能被系统延迟；不提供医学诊断。\n' "$GITHUB_REF_NAME" "$(date -u +%F)" > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v7
        if: always() && steps.sign.outcome == 'success'
        with:
          name: LuLeMa-v${{ env.VERSION }}-release
          path: dist/
      - name: Publish GitHub Release
        if: steps.sign.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --verify-tag --title "撸了吗 $GITHUB_REF_NAME — 人类迷惑行为研究所正式营业" --notes-file dist/RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f '${{ runner.temp }}/release.jks'
