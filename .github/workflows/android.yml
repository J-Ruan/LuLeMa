name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  VERSION: 0.2.0
jobs:
  signing-readiness:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.keys.outputs.ready }}
    steps:
      - name: Check presence of signing secrets without exposing values
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Formal signing secrets: all four are configured. Signed candidate validation is required.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            printf 'Formal signing unavailable. Missing secret names: %s\n' "${missing[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare SDK and Wrapper
        run: |
          chmod +x gradlew
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, Lint, Debug, R8 Release and device test APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Name APK and verify signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/LuLeMa-v${VERSION}-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/LuLeMa-v${VERSION}-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/LuLeMa-v${VERSION}-debug.apk" | head -1 | grep -F "versionCode='2' versionName='$VERSION'"
          cd dist && sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: LuLeMa-v${{ env.VERSION }}-debug
          path: dist/
          if-no-files-found: error
      - name: Retain checks and APKs even when a check fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure accelerated emulator
        run: bash .github/scripts/start-emulator.sh
      - run: chmod +x gradlew && ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
      - name: R8 smoke with a development signature, not a formal distribution APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/r8-smoke.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          python3 .github/scripts/release-smoke.py "$RUNNER_TEMP/r8-smoke.apk"
      - name: Collect device diagnostics
        if: always()
        run: |
          if timeout 5 "$ANDROID_HOME/platform-tools/adb" get-state >/dev/null 2>&1; then
            timeout 20 "$ANDROID_HOME/platform-tools/adb" logcat -d > device-logcat.txt || true
            timeout 20 "$ANDROID_HOME/platform-tools/adb" root || true
            timeout 20 "$ANDROID_HOME/platform-tools/adb" wait-for-device || true
            timeout 20 "$ANDROID_HOME/platform-tools/adb" pull /data/media/0/Android/data/com.lulema.app/files/screenshots screenshots || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator.log
            device-logcat.txt
            screenshots/
  release:
    if: (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-debug.'))) && needs.signing-readiness.outputs.ready == 'true'
    needs: [build, device-tests, signing-readiness]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check signing requirements
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release skipped: one or more signing secrets are missing. Debug APK remains in build artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v6
        if: steps.keys.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.keys.outputs.ready == 'true'
      - name: Build signed release and checksums
        id: sign
        if: steps.keys.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          chmod +x gradlew
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LuLeMa-v${VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/LuLeMa-v${VERSION}.apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/LuLeMa-v${VERSION}.apk")
          echo "$badging" | head -1 | grep -F "versionName='$VERSION'"
          echo "$badging" | head -1 | grep -F "name='com.lulema.app' versionCode='2'"
          echo "$badging" | grep -F "sdkVersion:'26'"
          if echo "$badging" | grep -q 'android.permission.INTERNET'; then exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cp docs/RELEASE_NOTES.md dist/RELEASE_NOTES.md
      - name: Start a dedicated emulator for the actual signed Release APK
        if: steps.sign.outcome == 'success'
        run: bash .github/scripts/start-emulator.sh
      - name: Install and smoke-test the actual formal signing candidate
        id: smoke
        if: steps.sign.outcome == 'success'
        run: python3 .github/scripts/release-smoke.py "dist/LuLeMa-v${VERSION}.apk"
      - uses: actions/upload-artifact@v7
        if: steps.smoke.outcome == 'success'
        with:
          name: LuLeMa-v${{ env.VERSION }}-release
          path: dist/
      - name: Publish GitHub Release
        if: steps.smoke.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --verify-tag --title "撸了吗 $GITHUB_REF_NAME — 人类迷惑行为研究所正式营业" --notes-file dist/RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        run: rm -f '${{ runner.temp }}/release.jks'

  debug-prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-debug.')
    needs: [build, device-tests]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download tested Debug APK and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "v${VERSION}-debug."* ]]
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "LuLeMa-v${VERSION}-debug" --dir dist
          test -s "dist/LuLeMa-v${VERSION}-debug.apk"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish clearly labeled Debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/LuLeMa-v${VERSION}-debug.apk" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --title "撸了吗 v${VERSION} · Debug 测试版" --notes-file docs/DEBUG_RELEASE_NOTES.md
